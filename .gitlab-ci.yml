stages:
  - build
  - test
  - publish
  - deploy
  - post

image:
  name: hashicorp/terraform:latest
  entrypoint:
    - "/usr/bin/env"
    - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

terraform_init:
  stage: build
  script:
    - terraform init
    - ls -al
  artifacts:
    paths:
      - .terraform/
      - .terraform.lock.hcl
    expire_in: 1 hour
  tags:
    - devops
    - docker
    - terraform

terraform_validate:
  stage: test
  script:
    - terraform validate
  dependencies:
    - terraform_init
  tags:
    - devops
    - docker
    - terraform

terraform_plan:
  stage: publish
  script:
    - terraform plan
  dependencies:
    - terraform_init
  tags:
    - devops
    - docker
    - terraform

terraform_apply:
  stage: deploy
  script:
    - terraform apply -auto-approve
  dependencies:
    - terraform_init
  artifacts:
    paths:
      - terraform.tfstate
    expire_in: 1 hour
  tags:
    - devops
    - docker
    - terraform

terraform_delete:
  stage: post
  script:
    - terraform destroy -auto-approve
  dependencies:
    - terraform_init
  when: manual
  tags:
    - devops
    - docker
    - terraform